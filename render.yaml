# Render Blueprint: New > Blueprint > pick this repo. Secrets (sync: false) are prompted for once.
services:
  - type: web
    name: recall-api
    runtime: node
    rootDir: backend
    plan: free
    buildCommand: npm install      # the API has zero dependencies, so this is instant
    startCommand: npm start
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: NODE_ENV
        value: production
      - key: FIREBASE_PROJECT_ID
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: CORS_ORIGINS            # your Vercel URL, e.g. https://recall.vercel.app
        sync: false
