<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#ffffff">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Recall">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/recall-192.png" type="image/png">
  <link rel="apple-touch-icon" href="icons/recall-192.png">
  <title>Recall — make it stick</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar" id="appSidebar" hidden>
      <div class="sidebar-brand-row"><a class="brand" href="#dashboard" aria-label="Recall home"><span class="brand-mark">r</span><span>recall<span class="brand-dot">.</span></span></a><button class="drawer-close" id="drawerClose" type="button" aria-label="Close navigation"><i data-lucide="x"></i></button></div>
      <div class="sidebar-scroll"><div class="workspace-label">WORKSPACE</div>
      <nav class="main-nav" aria-label="Main navigation">
        <button class="nav-item active" data-view="dashboard"><span class="nav-icon"><i data-lucide="layout-dashboard"></i></span>Overview</button>
        <button class="nav-item" data-view="library"><span class="nav-icon"><i data-lucide="layers-2"></i></span>My decks <span class="nav-count" id="navDeckCount">0</span></button>
        <a class="nav-item" data-view="cards" href="overview.html?view=cards"><span class="nav-icon"><i data-lucide="library-big"></i></span>Flashcard Library</a>
        <button class="nav-item" data-view="stats"><span class="nav-icon"><i data-lucide="chart-no-axes-column-increasing"></i></span>Study stats</button>
      </nav>
      <div class="sidebar-divider"></div>
      <div class="workspace-label deck-label">YOUR DECKS <button class="tiny-add" id="sideAddDeck" aria-label="Add deck"><i data-lucide="plus"></i></button></div>
      <div class="sidebar-decks" id="sidebarDecks"></div>
      <div class="sidebar-spacer"></div></div>
      <div class="sidebar-tip"><div class="tip-spark"><i data-lucide="sparkles"></i></div><strong>Small steps add up.</strong><p>A little review today saves a lot of cramming tomorrow.</p></div>
      <div class="profile"><div class="avatar" id="profileAvatar">G</div><div><strong id="profileName">Guest</strong><span id="profileCaption">Learning every day</span></div></div>
    </aside>
    <main class="main-area">
      <header class="topbar" hidden>
        <div class="topbar-start"><button class="menu-toggle" id="menuToggle" type="button" aria-label="Open navigation" aria-controls="appSidebar" aria-expanded="false"><i data-lucide="menu"></i></button><div class="breadcrumb"><span>Workspace</span><span class="crumb-slash">/</span><strong id="breadcrumbCurrent">Overview</strong></div></div>
        <div class="top-actions">
          <label class="header-search"><i data-lucide="search"></i><input id="globalSearch" type="search" placeholder="Search decks" aria-label="Search decks"></label>
          <span class="today-label" id="todayLabel"></span>
          <button class="quiet-button install-button" data-install hidden>Install app</button>
          <button class="icon-button" id="helpButton" aria-label="About Recall"><i data-lucide="circle-help"></i></button>
          <button class="quiet-button" id="sessionButton" onclick="window.exitRecallSession()">Sign out</button>
          <div class="avatar small-avatar" id="headerAvatar">G</div>
        </div>
      </header>
      <div id="appContent" class="content"></div>
    </main>
  </div>
  <div class="mobile-nav-overlay" id="mobileNavOverlay" hidden></div>
  <div id="modalRoot"></div>
  <div id="toast" class="toast" role="status" aria-live="polite"><span data-toast-message></span><button class="toast-dismiss" type="button" aria-label="Dismiss notification"><i data-lucide="x"></i></button></div>
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
  <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.js"></script>
  <script src="config.js"></script>
  <script src="backend.js"></script>
  <script src="app.js"></script>
</body>
</html>
